name: CI

on:
  pull_request:
    # `edited` is included so the changelog-completeness gate re-runs when a
    # title is corrected. Conventional PR titles stay required (CI); under dual
    # merge policy (A-1176) feature PRs land as merge commits and release-please
    # ranks Conventional Commits on main (A-824) — the title is no longer the
    # sole post-merge bump signal. A stale completeness pass on an old title
    # would still be unsafe. The conventional-PR-title lint lives in
    # validate-pr-title.yml (A-431) and re-runs on `edited` there too.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A-1100 / A-1195: never cancel a RUNNING run. A superseded run's `needs` all
  # report `cancelled`, the always() aggregator still executes, and its verdict
  # mints a FALSE RED `GO/NO GO`. With `false`, concurrency can only cancel a
  # *pending* run (no check-runs minted). Subsumes the A-961 release-please
  # carve-out — covers every branch, not just the release one.
  cancel-in-progress: false

# Defence-in-depth (ASW-313): the repo default is already read-only, but
# pin it here so a future org-policy change can't silently widen CI's token.
permissions:
  contents: read

# Wave 3 consumer (A-589 / A-593): lint + build-test run through the estate's
# shared reusable workflows, floating on the `@v1` major tag so non-breaking
# releases arrive without a per-release Dependabot SHA bump (A-662 / A-672).
# This repo is config-only — no build step and no ESLint (its
# published artefact is `.markdownlint.jsonc`), so the lint job runs markdownlint
# + YAML/actionlint + changelog validation, and build-test runs typecheck +
# Vitest + ShellCheck + bats with `build: false`. The changelog-completeness gate
# and the `GO/NO GO` aggregator stay local (A-418). PR-title validation is a
# separate workflow (validate-pr-title.yml, A-431) required directly by the
# estate ruleset.
jobs:
  config:
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-load-repo-config.yml@v1
    permissions:
      contents: read

  lint:
    needs: config
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-lint.yml@v1
    with:
      node-version-file: ${{ needs.config.outputs.node_version_file }}
      # Config-only package: no TypeScript/JS source to ESLint.
      eslint: false
      # Mirror the repo's own `lint:md` script so CI lints exactly what the repo
      # intends — vendored skill bundles (.claude/skills, .agents/skills) and
      # build output are excluded.
      markdown-globs: |
        **/*.{md,mdx}
        !**/node_modules/**
        !**/dist/**
        !**/.turbo/**
        !**/.astro/**
        !.agents/skills/**
        !.claude/skills/**
      changelog-script: validate:changelog

  build-test:
    needs: config
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-build-test.yml@v1
    with:
      node-version-file: ${{ needs.config.outputs.node_version_file }}
      # No build step — the published artefact is `.markdownlint.jsonc` itself.
      build: false
      shellcheck-paths: "infrastructure/scripts .husky/pre-commit .husky/pre-push .husky/commit-msg"
      bats: true

  changelog-completeness:
    name: 📓 Changelog completeness
    needs: config
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ needs.config.outputs.node_version_file }}
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📓 Changelog completeness
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changelog-core check-completeness

  go-no-go:
    name: GO/NO GO
    needs: [config, lint, build-test, changelog-completeness]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⚖️ Verdict
        # Pass/fail by inspecting the `needs` results (A-1103 / A-1195). `skipped`
        # is allowlisted only on `release-please--*` branches (path-skipped jobs);
        # everywhere else every needed job must report `success`. `failure`,
        # `cancelled` and a null/empty result fail the gate.
        #
        # `cancelled` is deliberately NOT allowlisted (A-1100). NEVER reach for
        # `if: !cancelled()` on this job — a skipped check-run counts as SUCCESS
        # for required status checks and would forge the gate.
        env:
          # Read through `env:`, never interpolate into the shell body: job
          # names reach this context from the workflow and would otherwise be a
          # template-injection surface.
          NEEDS_JSON: ${{ toJSON(needs) }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Allow `skipped` only on release-please path-skips; otherwise every
          # needed job must have succeeded (A-1103).
          if [[ "$HEAD_REF" == release-please--* ]]; then
            ALLOWED='["success","skipped"]'
          else
            ALLOWED='["success"]'
          fi
          echo "$NEEDS_JSON" \
            | jq -e --argjson ok "$ALLOWED" \
              'to_entries | all(.value.result as $r | $ok | index($r))' >/dev/null \
            || { echo "::error::a required check failed — refusing to go"; exit 1; }
          echo "All required checks passed — GO."
